<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="popup.css">
  <title>Dislocation Radar India</title>
</head>
<body>
  <!-- Top Bar -->
  <header id="topBar">
    <div class="title-row">
      <h1>Dislocation Radar <span class="flag">IN</span></h1>
      <div class="status-group">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusLabel">Loading...</span>
      </div>
    </div>
    <div class="meta-row">
      <span id="lastUpdated">--</span>
      <span id="marketStatus" class="market-badge">--</span>
      <button id="refreshBtn" class="icon-btn" title="Force refresh">&#x21bb;</button>
    </div>
  </header>

  <!-- Section 1: Active Event -->
  <section id="eventSection" class="section hidden">
    <div class="section-header">
      <span class="section-icon">&#x26A1;</span>
      <span class="section-title">ACTIVE EVENT</span>
    </div>
    <div id="eventContent" class="event-content"></div>
  </section>

  <!-- Section 2: Spread Dashboard -->
  <section id="spreadSection" class="section">
    <div class="section-header">
      <span class="section-icon">&#x1F4CA;</span>
      <span class="section-title">SPREAD DASHBOARD</span>
    </div>
    <div class="table-wrapper">
      <table id="spreadTable">
        <thead>
          <tr>
            <th>Spread</th>
            <th>Current</th>
            <th>Normal</th>
            <th>Z-Score</th>
            <th>30d</th>
          </tr>
        </thead>
        <tbody id="spreadBody"></tbody>
      </table>
    </div>
    <div id="noData" class="no-data hidden">No spread data yet. Waiting for first fetch...</div>
  </section>

  <!-- Section 3: Historical Match -->
  <section id="analogSection" class="section hidden">
    <div class="section-header">
      <span class="section-icon">&#x1F50D;</span>
      <span class="section-title">HISTORICAL MATCH</span>
    </div>
    <div id="analogContent" class="analog-content"></div>
  </section>

  <!-- Section 4: Quick Stats -->
  <section id="statsSection" class="section hidden">
    <div class="section-header">
      <span class="section-icon">&#x1F4B9;</span>
      <span class="section-title">FADE STATISTICS</span>
    </div>
    <div id="statsContent" class="stats-content"></div>
  </section>

  <!-- Footer -->
  <footer>
    <a href="#" id="settingsLink">Settings</a>
    <span class="sep">|</span>
    <span class="version">v1.0.0</span>
    <span class="sep">|</span>
    <span class="data-note">Data: Yahoo Finance, ExchangeRate API</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
